[project]
name = "financial-agent"
version = "0.0.0"
description = "Capstone Financial Helpdesk Agent: LangGraph + FastAPI + Postgres/pgvector."
requires-python = ">=3.11,<4.0"
dependencies = [
    "httpx>=0.27,<1.0",
    "fastapi>=0.115,<0.120",
    "uvicorn[standard]>=0.30,<1.0",
    "langgraph>=0.2,<0.3",
    "langchain-core>=0.3,<0.4",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "loguru>=0.7,<1.0",          # OR structlog; pick exactly one
    "sqlalchemy (>=2.0,<3.0)",
    "psycopg[binary] (>=3.1,<4.0)",
    "pgvector (>=0.2,<1.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx[http2]>=0.27",        # for ASGI test client
    "mypy>=1.10,<2.0",
    "ruff>=0.5,<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "data_pipelines*"]

# Poetry manages dependencies only; this is an application, not a
# distributable package. Docker still builds via `pip install -e .`
# (setuptools config above). See README "Local development".
[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "S101"]
# Delivered data-prep scripts are vendored reference artifacts (Constitution:
# "already built; do not modify"); do not flag their style like first-party code.
"data_pipelines/ingest_tables/build_starter_sample.py" = ["RET504"]
"data_pipelines/ingest_docs/fetch_starter_docs.py" = ["RET504"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_untyped_decorators = false
files = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# network tests need a live provider/Postgres; skipped by default. Run them
# explicitly with: pytest -m network
addopts = "-m 'not network'"
markers = [
    "network: requires live network or Postgres; skipped by default",
]
testpaths = ["tests"]
